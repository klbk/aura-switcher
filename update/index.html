  ko: ["최신 버전을 사용 중입니다", "AURA Switcher {v} 출시", "현재 버전: {v}", "새로운 기능", "업데이트 방법", "AURA 종료: 메뉴 막대의 언어 코드 클릭 → «종료».", "내려받은 압축 파일을 열고 AURA Switcher를 응용 프로그램으로 끌어 기존 앱을 대치하세요.", "AURA를 여세요. macOS가 새 권한 «입력 모니터링»을(를) 요청합니다. 허용하고 AURA 재시작에 동의하세요. 언어 코드 대신 ⚠︎가 보이면 여기서 AURA를 껐다가 다시 켜세요:", "AURA 종료: 트레이의 아이콘 클릭 → «종료».", "압축을 풀고 새 «AURA Switcher.exe»를 기존 파일 자리에 두세요.", "AURA Switcher.exe 실행 — 설정은 그대로 유지됩니다.", "AURA Switcher 웹사이트"],
  zh: ["当前已是最新版本", "AURA Switcher {v} 已发布", "当前版本 {v}", "更新内容", "如何更新", "退出 AURA：点击菜单栏中的语言代码 → “退出”。", "打开下载的压缩包，将 AURA Switcher 拖入“应用程序”文件夹并替换旧版本。", "打开 AURA。macOS 会请求新的权限「输入监控」——请允许，并同意重新启动 AURA。如果显示 ⚠︎ 而不是语言代码，请在此处将 AURA 关闭再重新开启：", "退出 AURA：右键点击系统托盘中的图标 → “退出”。", "解压压缩包，用新的“AURA Switcher.exe”替换旧文件。", "运行 AURA Switcher.exe — 你的个人设置将会完整保留。", "AURA Switcher 官网"],
  be: ["У вас апошняя версія", "Выйшла AURA Switcher {v}", "У вас {v}", "Што новага", "Як абнавіць", "Закрыйце AURA: клік па коду мовы ўверсе → «Выхад».", "Адкрыйце спампаваны архіў і перацягніце AURA Switcher у Праграмы, замяніўшы стары.", "Адкрыйце AURA. macOS папросіць новы дазвол «Input Monitoring» — дазвольце яго і пагадзіцеся перазапусціць AURA. Калі замест кода мовы бачны ⚠︎, выключыце AURA і ўключыце зноў тут:", "Закрыйце AURA: клік па яе значку ў вобласці апавяшчэнняў → «Выхад».", "Распакуйце архіў і пакладзіце новы «AURA Switcher.exe» на месца старога.", "Запусціце AURA Switcher.exe — вашы налады застануцца.", "Сайт AURA Switcher"],
  kk: ["Сізде соңғы нұсқа бар", "AURA Switcher {v} шықты", "Сізде {v}", "Не жаңалық", "Қалай жаңартуға болады", "AURA-ны жабыңыз: мәзір жолындағы тіл кодын басыңыз → «Шығу».", "Жүктелген мұрағатты ашып, AURA Switcher-ді ескісінің орнына «Қолданбалар» қалтасына сүйреңіз.", "AURA-ны ашыңыз. macOS жаңа рұқсат сұрайды: «Input Monitoring» — оған рұқсат беріп, AURA-ны қайта іске қосуға келісіңіз. Тіл коды орнына ⚠︎ көрінсе, AURA-ны осы жерде өшіріп, қайта қосыңыз:", "AURA-ны жабыңыз: хабарландыру аймағындағы белгішесін басыңыз → «Шығу».", "Мұрағатты ашып, жаңа «AURA Switcher.exe» файлын ескісінің орнына қойыңыз.", "AURA Switcher.exe іске қосыңыз — баптауларыңыз сақталады.", "AURA Switcher сайты"],
  ky: ["Сизде акыркы версия бар", "AURA Switcher {v} чыкты", "Сизде {v}", "Эмне жаңы", "Кантип жаңыртуу керек", "AURA’ны жабыңыз: меню саптагы тил кодун басыңыз → «Чыгуу».", "Жүктөлгөн архивди ачып, AURA Switcher’ди эскисинин ордуна «Колдонмолор» папкасына сүйрөңүз.", "AURA’ны ачыңыз. macOS жаңы уруксат сурайт: «Input Monitoring» — уруксат берип, AURA’ны кайра иштетүүгө макул болуңуз. Тил кодунун ордуна ⚠︎ көрүнсө, AURA’ны бул жерден өчүрүп, кайра күйгүзүңүз:", "AURA’ны жабыңыз: билдирме аймагындагы сүрөтчөсүн басыңыз → «Чыгуу».", "Архивди ачып, жаңы «AURA Switcher.exe» файлын эскисинин ордуна коюңуз.", "AURA Switcher.exe иштетиңиз — жөндөөлөрүңүз сакталат.", "AURA Switcher сайты"],
  ka: ["გაქვთ უახლესი ვერსია", "გამოვიდა AURA Switcher {v}", "თქვენ გაქვთ {v}", "რა არის ახალი", "როგორ განვაახლოთ", "დახურეთ AURA: დააწკაპუნეთ ენის კოდზე მენიუს ზოლში → «გასვლა».", "გახსენით ჩამოტვირთული არქივი და გადაიტანეთ AURA Switcher აპლიკაციების საქაღალდეში ძველის ნაცვლად.", "გახსენით AURA. macOS მოითხოვს ახალ ნებართვას, «Input Monitoring» — დართეთ ნება და დაეთანხმეთ AURA-ს გადატვირთვას. თუ ენის კოდის ნაცვლად ჩანს ⚠︎, გამორთეთ AURA და ისევ ჩართეთ აქ:", "დახურეთ AURA: დააწკაპუნეთ მის ხატულაზე შეტყობინებების არეში → «გასვლა».", "გახსენით არქივი და ახალი «AURA Switcher.exe» ძველის ადგილას ჩაანაცვლეთ.", "გაუშვით AURA Switcher.exe — თქვენი პარამეტრები შენარჩუნდება.", "AURA Switcher-ის საიტი"],
  hy: ["Դուք ունեք վերջին տարբերակը", "Թողարկվել է AURA Switcher {v}", "Դուք ունեք {v}", "Ինչ նոր է", "Ինչպես թարմացնել", "Փակեք AURA-ն․ սեղմեք լեզվի կոդին մենյուի տողում → «Ելք»։", "Բացեք ներբեռնված արխիվը և քաշեք AURA Switcher-ը Applications թղթապանակ՝ հինը փոխարինելով։", "Բացեք AURA-ն։ macOS-ը նոր թույլտվություն կխնդրի՝ «Input Monitoring»․ թույլ տվեք և համաձայնեք վերագործարկել AURA-ն։ Եթե լեզվի կոդի փոխարեն ⚠︎ է երևում, անջատեք AURA-ն և նորից միացրեք այստեղ․", "Փակեք AURA-ն․ սեղմեք նրա պատկերակին ծանուցումների գոտում → «Ելք»։", "Բացեք արխիվը և նոր «AURA Switcher.exe»-ն դրեք հինի փոխարեն։", "Գործարկեք AURA Switcher.exe-ն — ձեր կարգավորումները կպահպանվեն։", "AURA Switcher-ի կայքը"],
  az: ["Ən son versiya sizdədir", "AURA Switcher {v} çıxdı", "Sizdə {v} var", "Nə yenidir", "Necə yeniləmək olar", "AURA-dan çıxın: menyu panelindəki dil koduna klikləyin → «Çıxış».", "Yüklənmiş arxivi açın və AURA Switcher-i köhnəsinin yerinə Applications qovluğuna sürüşdürün.", "AURA-nı açın. macOS yeni icazə istəyəcək: «Input Monitoring» — icazə verin və AURA-nın yenidən başladılmasına razılaşın. Dil kodunun yerində ⚠︎ görünürsə, AURA-nı burada söndürüb yenidən yandırın:", "AURA-dan çıxın: bildiriş sahəsindəki işarəsinə klikləyin → «Çıxış».", "Arxivi açın və yeni «AURA Switcher.exe» faylını köhnəsinin yerinə qoyun.", "AURA Switcher.exe faylını işə salın — ayarlarınız qalacaq.", "AURA Switcher saytı"],
  sr: ["Имате најновију верзију", "Изашао је AURA Switcher {v}", "Имате {v}", "Шта је ново", "Како ажурирати", "Затворите AURA: кликните на код језика у траци менија → «Изађи».", "Отворите преузету архиву и превуците AURA Switcher у Applications, уместо старе верзије.", "Отворите AURA. macOS ће затражити нову дозволу, «Input Monitoring» — дозволите је и пристаните на поновно покретање AURA. Ако се уместо кода језика види ⚠︎, искључите AURA и поново је укључите овде:", "Затворите AURA: кликните на њену икону у пољу за обавештења → «Изађи».", "Распакујте архиву и ставите нови «AURA Switcher.exe» на место старог.", "Покрените AURA Switcher.exe — подешавања остају као што су била.", "Веб-сајт AURA Switcher"],
  mk: ["Ја имате најновата верзија", "Излезе AURA Switcher {v}", "Имате {v}", "Што е ново", "Како да ажурирате", "Затворете ја AURA: кликнете на кодот на јазикот во лентата со мени → «Излези».", "Отворете ја преземената архива и повлечете го AURA Switcher во Applications, наместо старата верзија.", "Отворете ја AURA. macOS ќе побара нова дозвола, «Input Monitoring» — дозволете ја и согласете се AURA да се рестартира. Ако наместо кодот на јазикот се гледа ⚠︎, исклучете ја AURA и повторно вклучете ја овде:", "Затворете ја AURA: кликнете на нејзината икона во полето за известувања → «Излези».", "Распакувајте ја архивата и ставете го новиот «AURA Switcher.exe» на местото на стариот.", "Стартувајте го AURA Switcher.exe — поставките остануваат исти.", "Веб-страница на AURA Switcher"],
  sk: ["Máte najnovšiu verziu", "Vyšiel AURA Switcher {v}", "Máte {v}", "Čo je nové", "Ako aktualizovať", "Ukončite AURA: kliknite na kód jazyka v paneli ponuky → «Ukončiť».", "Otvorte stiahnutý archív a presuňte AURA Switcher do Aplikácií, čím nahradíte starú verziu.", "Otvorte AURA. macOS požiada o nové povolenie «Monitorovanie vstupu (Input Monitoring)» — povoľte ho a súhlaste s reštartom AURA. Ak sa namiesto kódu jazyka zobrazí ⚠︎, vypnite AURA a znova ju zapnite tu:", "Ukončite AURA: kliknite na jej ikonu v oblasti oznámení → «Ukončiť».", "Rozbaľte archív a nový «AURA Switcher.exe» dajte na miesto starého.", "Spustite AURA Switcher.exe — vaše nastavenia zostanú zachované.", "Web AURA Switcher"],
  hr: ["Imate najnoviju verziju", "Izašao je AURA Switcher {v}", "Imate {v}", "Što je novo", "Kako ažurirati", "Zatvorite AURA: kliknite na kod jezika u traci izbornika → «Izađi».", "Otvorite preuzetu arhivu i povucite AURA Switcher u Aplikacije, čime zamjenjujete staru verziju.", "Otvorite AURA. macOS će zatražiti novo dopuštenje, «Praćenje unosa (Input Monitoring)» — dopustite ga i pristanite na ponovno pokretanje AURA. Ako se umjesto koda jezika vidi ⚠︎, isključite AURA i ponovno je uključite ovdje:", "Zatvorite AURA: kliknite na njezinu ikonu u području obavijesti → «Izađi».", "Raspakirajte arhivu i novi «AURA Switcher.exe» stavite na mjesto starog.", "Pokrenite AURA Switcher.exe — vaše postavke ostaju kakve jesu.", "Web-stranica AURA Switcher"],
  sl: ["Imate najnovejšo različico", "Izšel je AURA Switcher {v}", "Imate {v}", "Kaj je novega", "Kako posodobiti", "Zaprite AURA: kliknite kodo jezika v menijski vrstici → «Končaj».", "Odprite preneseni arhiv in povlecite AURA Switcher v Aplikacije, da nadomestite staro različico.", "Odprite AURA. macOS bo zahteval novo dovoljenje, «Input Monitoring» — dovolite ga in se strinjajte s ponovnim zagonom AURA. Če se namesto kode jezika prikaže ⚠︎, AURA tukaj izklopite in znova vklopite:", "Zaprite AURA: kliknite njeno ikono v obvestilnem območju → «Končaj».", "Razpakirajte arhiv in novi «AURA Switcher.exe» dajte na mesto starega.", "Zaženite AURA Switcher.exe — vaše nastavitve ostanejo nespremenjene.", "Spletno mesto AURA Switcher"],

  lv: ["Jums ir jaunākā versija", "Iznācis AURA Switcher {v}", "Jums ir {v}", "Kas jauns", "Kā atjaunināt", "Aizveriet AURA: noklikšķiniet uz valodas koda izvēlņu joslā → «Iziet».", "Atveriet lejupielādēto arhīvu un velciet AURA Switcher uz Programmas, aizstājot veco.", "Atveriet AURA. macOS pieprasīs jaunu atļauju «Input Monitoring» — atļaujiet to un piekrītiet AURA restartēšanai. Ja valodas koda vietā redzams ⚠︎, izslēdziet AURA un ieslēdziet to vēlreiz šeit:", "Aizveriet AURA: noklikšķiniet uz tās ikonas paziņojumu apgabalā → «Iziet».", "Izpakojiet arhīvu un jauno «AURA Switcher.exe» ielieciet vecā vietā.", "Palaidiet AURA Switcher.exe — iestatījumi saglabāsies.", "AURA Switcher vietne"],
